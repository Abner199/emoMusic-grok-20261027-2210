<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>当AI遇见旋律：人脸窗</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}?v=50" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}?v=50" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}?v=50" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}?v=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=88" />
</head>
<body class="face-page" data-emotion="idle">
  <header class="face-top">
    <a class="brand" href="/" target="_blank" rel="noopener">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="none">
          <rect x="2.2" y="2.2" width="43.6" height="43.6" rx="11.5" stroke="currentColor" stroke-width="1.35" opacity=".5"/>
          <path d="M15.2 13.2c-1.3 7.6-1.2 15.2 3 20.4 2.1 2.6 6.3 3.8 8.6 1.7 4.3-3.9 5.5-12.1 4.5-22.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M16.4 16.2h15.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M19.2 16.7v16.2M24 16.7v18.2M28.8 16.7v16.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <ellipse cx="24" cy="25.2" rx="3.7" ry="4.4" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="24" cy="25.2" r="1.05" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text"><strong>当AI遇见旋律</strong><em>人脸窗</em></span>
    </a>
    <p class="face-lead" id="face-lead">默认单人精检只认近景主脸。切到多人远场后可同时框出多张脸和远景小脸，歌曲按人数最多的情绪来。</p>
    <div class="face-actions">
      <label class="switch"><input type="checkbox" id="live-toggle" /><span>实时捕捉</span></label>
      <button type="button" class="primary" id="btn-cam">开启摄像头</button>
      <button type="button" class="ghost" id="btn-recognize">识别此刻</button>
      <button type="button" class="ghost" id="btn-close">关闭窗口</button>
    </div>
  </header>

  <div class="face-mode-bar" id="face-mode-bar">
    <span class="strat-label">检测方式</span>
    <div class="strat-picks" id="face-mode-picks" role="radiogroup" aria-label="人脸检测方式">
      <button type="button" class="strat-pick is-on" data-face-mode="solo" role="radio" aria-checked="true" title="只取最大最稳的一张脸">单人精检</button>
      <button type="button" class="strat-pick" data-face-mode="crowd" role="radio" aria-checked="false" title="多张脸与远景小脸，按人数最多的情绪">多人远场</button>
    </div>
    <div class="source-row" id="cam-select-row">
      <label class="source-label" for="cam-select">摄像头</label>
      <select id="cam-select" aria-label="选择摄像头">
        <option value="">开启后列出可用摄像头</option>
      </select>
    </div>
  </div>

  <section class="face-shell">
    <div class="viewport face-viewport" id="viewport" data-fit="cover">
      <div class="cam-layer" id="cam-layer">
        <video id="cam" class="is-mirror" playsinline webkit-playsinline autoplay muted></video>
        <canvas id="shot" hidden></canvas>
        <canvas id="face-overlay" class="face-overlay" aria-hidden="true"></canvas>
      </div>
      <div class="live-emo-hud" id="live-emo-hud" hidden data-emo="idle">
        <span class="live-emo-dot" id="live-emo-dot" hidden></span>
        <strong id="live-emo-zh"></strong>
        <span id="live-emo-name">寻找人脸</span>
        <em id="live-emo-pct"></em>
        <em id="live-emo-count"></em>
      </div>
      <div class="cam-dock" id="cam-dock">
        <div class="cam-dock-row">
          <span class="cam-dock-label">关键点</span>
          <div class="dock-picks" id="landmark-picks" role="radiogroup" aria-label="关键点显示">
            <button type="button" class="dock-pick is-on" data-landmark="overlay" role="radio" aria-checked="true" title="实拍标注">实拍</button>
            <button type="button" class="dock-pick" data-landmark="mesh" role="radio" aria-checked="false" title="线框骨架">线框</button>
            <button type="button" class="dock-pick" data-landmark="off" role="radio" aria-checked="false" title="不显示关键点">关闭</button>
          </div>
        </div>
        <div class="cam-dock-row">
          <button type="button" class="dock-pick" id="btn-cam-fill" title="摄像头铺满整个窗口">铺满窗口</button>
          <button type="button" class="dock-pick is-on" id="btn-cam-fit" title="画面铺满视窗">铺满画面</button>
          <label class="cam-zoom" title="放大缩小比率">
            <span>比率</span>
            <input type="range" id="cam-zoom" min="50" max="250" step="5" value="100" aria-label="摄像头放大缩小比率" />
            <em id="cam-zoom-val">100%</em>
          </label>
        </div>
      </div>
      <div class="cam-empty" id="cam-empty">
        <p id="cam-empty-text">点「开启摄像头」后，这里会标出画面里每一张脸的情绪。</p>
        <button type="button" class="primary" id="btn-cam-empty">开启摄像头</button>
      </div>
    </div>
    <div class="vote-bar" id="vote-bar" hidden></div>
  </section>
  <p class="hint" id="face-hint">YuNet 五点 · FACS 口眼眉线索 · 实拍 / 线框可切换 · 单人精检只取主脸 · 多人远场按多数票推荐</p>
  <script src="{{ url_for('static', filename='js/face-draw.js') }}?v=88"></script>
  <script src="{{ url_for('static', filename='js/face.js') }}?v=88"></script>
</body>
</html>
